name: Daily 44 SMA Stock Scanner

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab for testing

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests openpyxl

      - name: Run 44 SMA Scanner Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python telegram_nse.py
